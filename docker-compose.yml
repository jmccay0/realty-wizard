version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: realty-wizard-postgres
    environment:
      POSTGRES_USER: realwiz
      POSTGRES_PASSWORD: realwiz_dev_password
      POSTGRES_DB: realty_wizard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realwiz"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
